name: daily-backfill
# สร้างชุดรายงานประจำวันย้อนหลัง (ไม่ส่ง LINE): วางไฟล์ payload daily/backfill/YYYY-MM-DD.json แล้ว push
on:
  push:
    paths: ['daily/backfill/*.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-report
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: daily/requirements.txt
      - run: pip install -r daily/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build
        env:
          NOSEND: '1'
        run: |
          for f in $(ls daily/backfill/*.json | sort); do
            d=$(basename "$f" .json)
            if [ -f "line/daily/$d/status.json" ]; then echo "skip $d"; continue; fi
            python daily/pipeline.py "$f" "${{ github.run_id }}" || true
          done
      - name: Commit
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add line
          git commit -m "รายงานประจำวันย้อนหลัง $(date +%F)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
