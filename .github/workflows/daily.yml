name: daily-report
# รับข้อมูลจากบอท LINE (repository_dispatch: daily) แล้วสร้างชุดภาพ + ข้อความส่ง LINE
on:
  repository_dispatch:
    types: [daily]
  workflow_dispatch:
    inputs:
      src:
        description: 'ไฟล์ข้อมูลใน repo (.xlsx หรือ .json)'
        required: true
      send:
        description: 'ส่งเข้า LINE จริง (true/false)'
        default: 'false'
permissions:
  contents: write
concurrency:
  group: daily-report
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: daily/requirements.txt
      - run: pip install -r daily/requirements.txt
      - name: Chromium
        run: python -m playwright install --with-deps chromium
      - name: Payload
        if: github.event_name == 'repository_dispatch'
        env:
          P: ${{ toJson(github.event.client_payload) }}
        run: printf '%s' "$P" > /tmp/payload.json
      - name: Build
        env:
          SRC: ${{ github.event_name == 'repository_dispatch' && '/tmp/payload.json' || inputs.src }}
          NOSEND: ${{ (github.event_name == 'workflow_dispatch' && inputs.send != 'true' || github.event.client_payload.nosend) && '1' || '' }}
        run: python daily/pipeline.py "$SRC" "${{ github.run_id }}"
      - name: Commit
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add line
          git commit -m "รายงานประจำวันอัตโนมัติ $(date +%F)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
