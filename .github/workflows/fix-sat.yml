name: fix-satellite
# เติมภาพดาวเทียม (ภาพที่ 7) ย้อนหลัง: แก้วันที่ในไฟล์ daily/fix_sat_date.txt แล้ว push
on:
  push:
    paths: ['daily/fix_sat_date.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-report
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests Pillow
      - run: python daily/fix_sat.py "$(tr -d '[:space:]' < daily/fix_sat_date.txt)"
      - run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add line
          git commit -m "เติมภาพดาวเทียม $(cat daily/fix_sat_date.txt)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
